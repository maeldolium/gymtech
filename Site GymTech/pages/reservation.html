<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - GymTech</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <!-- NAVBAR -->
        <nav class="navbar">
            <!-- LOGO -->
            <a href="./index.html"><img src="../assets/images/logo/gymtech_logo.png" alt="Logo de GymTech" class="logo"></a>
            <div class="nav-container">
                <ul class="nav-links">
                    <li><a href="./reservation.html">Réservations</a></li>
                    <li><a href="./historique.html">Historique des séances</a></li>
                    <li><a href="./actus.html">Actualités</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                    <li class="mobile-only"><a href="#">Se connecter</a></li>
                    <li class="mobile-only"><a href="#">S'inscrire</a></li>
                </ul>
                <div class="burger">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <!-- BOUTON CONNEXION/INSCRIPTION -->
                <div class="button-connect">
                    <button id="connect">Se connecter</button>
                    <button id="register">S'inscrire</button>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <!-- RESERVATION -->
        <div class="reservation">
            <h2>Réservation</h2>
            <form action="">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
                <label for="time">Heure</label>
                <input type="time" id="time" name="time">
                <label for="duration">Durée</label>
                <input type="number" id="duration" name="duration">
                <label for="room">Salle</label>
                <select name="room" id="room">
                    <option value="room1">Salle 1</option>
                    <option value="room2">Salle 2</option>
                    <option value="room3">Salle 3</option>
                </select>
                <button type="submit">Réserver</button>
            </form>
        </div>

    </main>
</body>
</html>
